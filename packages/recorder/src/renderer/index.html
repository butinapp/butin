<!doctype html>
<!-- Dark-first by construction: Butin's brand is the operator's console in a dim room, and the capture
     window is dark, so the recorder shell hardcodes the dark theme. The inline background matches the
     charcoal canvas token so there's no white flash before the stylesheet loads. -->
<html lang="en" class="dark" style="background: #18181b; color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Butin Recorder</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
