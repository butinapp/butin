<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:"
    />
    <title>Butin</title>
    <!-- Set the theme class on <html> before the splash + first frame paint, so the loading screen follows the
         in-app theme (not the OS scheme). External file because the CSP forbids inline scripts. -->
    <script src="./theme-preload.js"></script>
    <style>
      /* Instant splash — painted the moment the document loads, before the JS bundle parses and the fonts +
         lazy route chunk arrive (the ~2s blank). main.tsx removes it on React's first committed frame. Uses a
         system font stack on purpose: @fontsource loads via JS later, so the brand wordmark must not depend on it.
         Brand: Quiet-instrument palette — charcoal canvas (#0e1116), single teal accent (#62d4c8). */
      html,
      body {
        margin: 0;
        height: 100%;
      }
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;
        background: #0e1116;
        font-family:
          ui-sans-serif,
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        opacity: 1;
        transition: opacity 280ms ease;
        /* Purely decorative and gone in ~280ms: never let it take a text selection, drag ghost, or focus
           outline, which flashed on the wordmark/icon as the app stole focus during the fade. */
        user-select: none;
        -webkit-user-select: none;
        pointer-events: none;
      }
      /* These rules are unlayered, so they win over the app stylesheet's `@layer base` `*` rule (which sets a
         border + outline color) the moment it loads mid-fade. Without this, a 1px box flashed around the icon
         and the wordmark for one frame. Reset every box-drawing property, and block drag/focus outright. */
      #splash svg,
      #splash .splash-word {
        border: 0;
        outline: 0;
        box-shadow: none;
        -webkit-user-drag: none;
      }
      #splash *:focus,
      #splash *:focus-visible {
        outline: 0;
        box-shadow: none;
      }
      #splash.splash--hide {
        opacity: 0;
      }
      /* The app icon (convergence hub mark), inlined so it paints with the document — no asset fetch.
         Hand-maintained copy of packages/core/src/renderer/assets/butin-mark.svg (generated by gen-icon.mjs).
         Keep this in sync with that file when the mark is regenerated — this splash is the drift-risk surface. */
      .splash-icon {
        width: 112px;
        height: 112px;
      }
      .splash-word {
        font-size: 1.05rem;
        font-weight: 600;
        letter-spacing: 0.32em;
        text-transform: uppercase;
        padding-left: 0.32em;
        color: #eef1f5;
        animation: splash-pulse 1.8s ease-in-out infinite;
      }
      @keyframes splash-pulse {
        0%,
        100% {
          opacity: 0.55;
        }
        50% {
          opacity: 1;
        }
      }
      /* The splash follows the in-app theme: theme-preload.js sets the `dark` class on <html> before this
         paints, so a light-mode app shows a light canvas even on a dark desktop. The mark sits on its own
         tile, so it reads identically either way; once React mounts, next-themes keeps the class in sync. */
      html:not(.dark) #splash {
        background: #fafafb;
      }
      html:not(.dark) .splash-word {
        color: #2c323b;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <!-- Convergence hub mark — inlined for instant paint (no JS/fetch dependency).
           Hand-maintained copy of assets/butin-mark.svg (gen-icon.mjs). Keep in sync on regeneration. -->
      <svg class="splash-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" aria-hidden="true">
        <defs>
          <linearGradient id="sBg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1b2129" />
            <stop offset="100%" stop-color="#0d1014" />
          </linearGradient>
          <clipPath id="sClip"><rect width="128" height="128" rx="28" /></clipPath>
        </defs>
        <g clip-path="url(#sClip)">
          <rect width="128" height="128" fill="url(#sBg)" />
          <rect
            x="13"
            y="13"
            width="102"
            height="102"
            rx="19"
            fill="none"
            stroke="#ffffff"
            stroke-width="2"
            opacity="0.10"
          />
          <!-- Six satellite spokes + dots radiating from the central hub -->
          <g>
            <line x1="64.0" y1="30.0" x2="64.0" y2="48.0" stroke="#3c7d77" stroke-width="3.4" stroke-linecap="round" />
            <circle cx="64.0" cy="30.0" r="5" fill="#bdeee8">
              <animate
                attributeName="r"
                values="5;5;4;5"
                keyTimes="0;0.55;0.75;1"
                dur="3.6s"
                repeatCount="indefinite"
              />
            </circle>
            <line x1="93.4" y1="47.0" x2="77.9" y2="56.0" stroke="#3c7d77" stroke-width="3.4" stroke-linecap="round" />
            <circle cx="93.4" cy="47.0" r="5" fill="#bdeee8">
              <animate
                attributeName="r"
                values="5;5;4;5"
                keyTimes="0;0.55;0.75;1"
                dur="3.6s"
                repeatCount="indefinite"
              />
            </circle>
            <line x1="93.4" y1="81.0" x2="77.9" y2="72.0" stroke="#3c7d77" stroke-width="3.4" stroke-linecap="round" />
            <circle cx="93.4" cy="81.0" r="5" fill="#bdeee8">
              <animate
                attributeName="r"
                values="5;5;4;5"
                keyTimes="0;0.55;0.75;1"
                dur="3.6s"
                repeatCount="indefinite"
              />
            </circle>
            <line x1="64.0" y1="98.0" x2="64.0" y2="80.0" stroke="#3c7d77" stroke-width="3.4" stroke-linecap="round" />
            <circle cx="64.0" cy="98.0" r="5" fill="#bdeee8">
              <animate
                attributeName="r"
                values="5;5;4;5"
                keyTimes="0;0.55;0.75;1"
                dur="3.6s"
                repeatCount="indefinite"
              />
            </circle>
            <line x1="34.6" y1="81.0" x2="50.1" y2="72.0" stroke="#3c7d77" stroke-width="3.4" stroke-linecap="round" />
            <circle cx="34.6" cy="81.0" r="5" fill="#bdeee8">
              <animate
                attributeName="r"
                values="5;5;4;5"
                keyTimes="0;0.55;0.75;1"
                dur="3.6s"
                repeatCount="indefinite"
              />
            </circle>
            <line x1="34.6" y1="47.0" x2="50.1" y2="56.0" stroke="#3c7d77" stroke-width="3.4" stroke-linecap="round" />
            <circle cx="34.6" cy="47.0" r="5" fill="#bdeee8">
              <animate
                attributeName="r"
                values="5;5;4;5"
                keyTimes="0;0.55;0.75;1"
                dur="3.6s"
                repeatCount="indefinite"
              />
            </circle>
          </g>
          <!-- Central teal disc with subtle inward pulse -->
          <circle cx="64" cy="64" r="11" fill="#62d4c8">
            <animate
              attributeName="r"
              values="11;11;13;11"
              keyTimes="0;0.55;0.78;1"
              dur="3.6s"
              repeatCount="indefinite"
            />
          </circle>
        </g>
      </svg>
      <div class="splash-word">Butin</div>
    </div>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
