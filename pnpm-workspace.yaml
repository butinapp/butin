packages:
  - 'packages/*'
  - 'plugins'

overrides:
  react: 'catalog:'
  react-dom: 'catalog:'
  '@types/react': 'catalog:'
  '@types/react-dom': 'catalog:'
  # cheerio pulls undici for its URL loader, which no plugin calls; the pin keeps the resolved copy past the
  # advisories against the 7.x line so the audit stays clean.
  undici: '>=7.29.0'
  # electron-updater parses the remote latest*.yml with js-yaml; the pin keeps the resolved copy past the
  # merge-key / !!omap CPU-exhaustion advisories against 4.2, within the major electron-updater declares.
  js-yaml: '^4.3.2'
  # next's browserslist mapping; the pin clears the advisory against 2.10 (build-time only).
  baseline-browser-mapping: '>=2.11.0'

# Single source of truth for versions shared across packages (referenced as `catalog:` in each package.json).
# Anything depended on by more than one package lives here so versions can't drift — bump it once.
catalog:
  # React + the UI test stack (React is also pinned in pnpm.overrides so the whole graph resolves one copy).
  react: ^19.2.8
  react-dom: ^19.2.8
  '@types/react': ^19.2.18
  '@types/react-dom': ^19.2.7
  '@testing-library/react': ^16.3.3
  '@testing-library/jest-dom': ^7.0.1
  '@testing-library/user-event': ^14.6.7
  jsdom: ^29.1.1
  # Toolchain shared across packages.
  vitest: ^4.1.7
  '@types/node': ^25.9.3
  # Runtime libs shared across packages.
  zod: ^4.5.4
  lucide-react: ^0.525.0
  cheerio: ^1.2.0
  tailwindcss: ^4.3.3
  luxon: ^3.7.2
  '@types/luxon': ^3.7.5
  lodash-es: ^4.18.1
  '@types/lodash-es': ^4.17.12

allowBuilds:
  esbuild: true
  electron: true
  electron-winstaller: true
  sharp: true
  # wrangler's local runtime; only `wrangler dev` needs the binary, and nothing here runs that.
  workerd: false
