name: Release

# Cut a release whenever the app's version (packages/core/package.json — the version electron-builder
# stamps onto the installers) changes on master. Bump that field, commit, push: the matrix builds Win/mac/
# Linux installers and publishes a GitHub release tagged v<version>. A push whose tag already exists builds
# nothing.
on:
  push:
    branches:
      - master
    paths:
      - packages/core/package.json
  # A manual run builds all three installers as a dry run to verify the pipeline, whether or not the version is
  # already tagged; the publish job below is gated to push events, so a manual run never cuts a tag or release.
  workflow_dispatch:

# Never cancel a release mid-build; let a started run finish even if another push lands.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: ver
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: windows-latest
    # `id-token: write` lets azure/login trade this run's GitHub OIDC token for an Azure token. Azure trusts only
    # refs/heads/master of this repo, so a run from any other ref gets no token and cannot sign.
    permissions:
      contents: read
      id-token: write
    steps:
      # Repository variables set by the maintainer's Pulumi stack. A release is never built unsigned.
      - name: Require the signing configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository variables: ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @butinapp/core build
      # The signing identity holds one role, on one certificate profile, and sees no subscription.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # Signing is configured here only; electron-builder.yml carries none, so a local `pnpm package` builds unsigned.
      # electron-builder signs and timestamps the app, its helpers, the uninstaller and the installer through
      # Invoke-TrustedSigning, which authenticates with the azure/login session. publisherName must equal the
      # certificate's CN.
      - name: Build and sign
        shell: bash
        run: >-
          pnpm --filter @butinapp/core exec electron-builder --win --publish never
          --config.win.azureSignOptions.endpoint="${{ vars.AZURE_SIGNING_ENDPOINT }}"
          --config.win.azureSignOptions.codeSigningAccountName="${{ vars.AZURE_SIGNING_ACCOUNT }}"
          --config.win.azureSignOptions.certificateProfileName="${{ vars.AZURE_SIGNING_PROFILE }}"
          --config.win.azureSignOptions.publisherName="Yann Allard"
      - name: Verify the signatures
        shell: bash
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-windows-signature.ps1
          -Publisher "Yann Allard" "packages/core/release/*.exe" "packages/core/release/win-unpacked/*.exe"
          "packages/core/release/win-unpacked/resources/*.exe"
      - uses: actions/upload-artifact@v7
        with:
          name: windows
          path: |
            packages/core/release/*.exe
            packages/core/release/*.blockmap
            packages/core/release/latest.yml
          # The release job downloads these in the same run; keeping them 90 days blows the storage quota.
          retention-days: 1

  build-mac:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: macos-latest
    steps:
      # Repository secrets and variables set by the maintainer's Pulumi stack. A release is never built unsigned.
      - name: Require the signing configuration
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in MAC_CERTIFICATE MAC_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository secrets or variables: ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @butinapp/core build
      # notarytool reads the App Store Connect API key from a file.
      - name: Write the notarization key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
      # arch (universal) + target (dmg) come from packages/core/electron-builder.yml. Signing is configured here only:
      # CSC_LINK is the base64 .p12 electron-builder imports into a temporary keychain, and the APPLE_API_* values
      # turn on notarization, which staples the ticket to the app.
      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: pnpm --filter @butinapp/core exec electron-builder --mac --publish never --config.mac.notarize=true
      - name: Verify the signature and notarization
        run: |
          for app in packages/core/release/mac/Butin.app packages/core/release/mac-arm64/Butin.app; do
            bash scripts/verify-mac-signature.sh "$app" "Developer ID Application: Yann Allard (4ZJR6M393A)"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: |
            packages/core/release/*.dmg
            packages/core/release/*.zip
            packages/core/release/latest-mac.yml
          # The release job downloads these in the same run; keeping them 90 days blows the storage quota.
          retention-days: 1

  build-linux:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @butinapp/core build
      - run: pnpm --filter @butinapp/core exec electron-builder --linux --publish never
      - uses: actions/upload-artifact@v7
        with:
          name: linux
          path: |
            packages/core/release/*.AppImage
            packages/core/release/latest-linux.yml
          # The release job downloads these in the same run; keeping them 90 days blows the storage quota.
          retention-days: 1

  release:
    needs: [check, build-windows, build-mac, build-linux]
    if: needs.check.outputs.skip == 'false' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          files: artifacts/**
          generate_release_notes: true
