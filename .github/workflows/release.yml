name: Release

# Cut a release whenever the app's version (packages/core/package.json — the version electron-builder
# stamps onto the installers) changes on master. Bump that field, commit, push: the matrix builds Win/mac/
# Linux installers and publishes a GitHub release tagged v<version>. A push whose tag already exists builds
# nothing.
on:
  push:
    branches:
      - master
    paths:
      - packages/core/package.json
  # A manual run builds all three installers as a dry run to verify the pipeline, whether or not the version is
  # already tagged; the publish job below is gated to push events, so a manual run never cuts a tag or release.
  # Signing needs master: the Windows federated credential trusts only that ref, and the macOS job's environment
  # admits only protected branches, so a dry run from any other branch builds nothing signed.
  workflow_dispatch:

# Never cancel a release mid-build; let a started run finish even if another push lands.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Read-only by default; each job asks for exactly what it needs.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: ver
        run: |
          VERSION=$(node -p "require('./packages/core/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_EVENT_NAME" = "push" ] && git ls-remote --tags origin "refs/tags/v$VERSION" | grep -q .; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  build-windows:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: windows-latest
    # `id-token: write` lets azure/login trade this run's GitHub OIDC token for an Azure token. Azure trusts only
    # refs/heads/master of this repo, so a run from any other ref gets no token and cannot sign. The same token
    # signs the build-provenance attestation.
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Repository variables set by the maintainer's Pulumi stack. A release is never built unsigned.
      - name: Require the signing configuration
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: |
          missing=()
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SIGNING_ENDPOINT AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing repository variables: ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @butinapp/core build
      # The signing identity holds one role, on one certificate profile, and sees no subscription.
      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          allow-no-subscriptions: true
      # Signing is configured here only; electron-builder.yml carries none, so a local `pnpm package` builds unsigned.
      # electron-builder signs and timestamps the app, its helpers, the uninstaller and the installer through
      # Invoke-TrustedSigning, which authenticates with the azure/login session. publisherName must equal the
      # certificate's CN; electron-builder also stamps it into app-update.yml, which is what the updater checks a
      # downloaded installer against.
      - name: Build and sign
        shell: bash
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
        run: >-
          pnpm --filter @butinapp/core exec electron-builder --win --publish never
          --config.win.azureSignOptions.endpoint="$AZURE_SIGNING_ENDPOINT"
          --config.win.azureSignOptions.codeSigningAccountName="$AZURE_SIGNING_ACCOUNT"
          --config.win.azureSignOptions.certificateProfileName="$AZURE_SIGNING_PROFILE"
          --config.win.azureSignOptions.publisherName="Yann Allard"
      - name: Verify the signatures
        shell: bash
        run: >-
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts/verify-windows-signature.ps1
          -Publisher "Yann Allard" "packages/core/release/*.exe" "packages/core/release/win-unpacked/*.exe"
          "packages/core/release/win-unpacked/resources/*.exe"
      # A signed statement that these bytes came out of this workflow at this commit, verifiable with
      # `gh attestation verify <file> --owner butinapp`. Only a push builds what gets released.
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/core/release/*.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows
          path: |
            packages/core/release/*.exe
            packages/core/release/*.blockmap
            packages/core/release/latest.yml
          # The release job downloads these in the same run; keeping them 90 days blows the storage quota.
          retention-days: 1

  build-mac:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: macos-latest
    # The Developer ID certificate, its password and the notarization key are environment secrets, and the
    # environment admits protected branches only — a run from any other ref never sees them.
    environment: macos-signing
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      # Environment secrets and repository variables set by the maintainer's Pulumi stack. A release is never
      # built unsigned.
      - name: Require the signing configuration
        env:
          MAC_CERTIFICATE: ${{ secrets.MAC_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: |
          missing=()
          for name in MAC_CERTIFICATE MAC_CERTIFICATE_PASSWORD APPLE_API_KEY APPLE_API_KEY_ID APPLE_API_ISSUER; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::error::Missing environment secrets or repository variables: ${missing[*]}"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @butinapp/core build
      # notarytool reads the App Store Connect API key from a file.
      - name: Write the notarization key
        env:
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: printf '%s\n' "$APPLE_API_KEY" > "$RUNNER_TEMP/AuthKey.p8"
      # arch (x64 + arm64) + targets (dmg + zip) come from packages/core/electron-builder.yml. Signing is configured
      # here only: CSC_LINK is the base64 .p12 electron-builder imports into a temporary keychain, and the
      # APPLE_API_* values turn on notarization, which staples the ticket to the app.
      - name: Build, sign and notarize
        env:
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY: ${{ runner.temp }}/AuthKey.p8
          APPLE_API_KEY_ID: ${{ vars.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ vars.APPLE_API_ISSUER }}
        run: pnpm --filter @butinapp/core exec electron-builder --mac --publish never --config.mac.notarize=true
      # The key file outlives the step that used it only until here, so no later glob can sweep it up.
      - name: Remove the notarization key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
      - name: Verify the signature and notarization
        run: |
          for app in packages/core/release/mac/Butin.app packages/core/release/mac-arm64/Butin.app; do
            bash scripts/verify-mac-signature.sh "$app" "Developer ID Application: Yann Allard (4ZJR6M393A)"
          done
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            packages/core/release/*.dmg
            packages/core/release/*.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: mac
          path: |
            packages/core/release/*.dmg
            packages/core/release/*.zip
            packages/core/release/latest-mac.yml
          # The release job downloads these in the same run; keeping them 90 days blows the storage quota.
          retention-days: 1

  build-linux:
    needs: check
    if: needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @butinapp/core build
      - run: pnpm --filter @butinapp/core exec electron-builder --linux --publish never
      # AppImage has no code signature; the provenance attestation is what ties this file to this commit.
      - if: github.event_name == 'push'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: packages/core/release/*.AppImage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux
          path: |
            packages/core/release/*.AppImage
            packages/core/release/latest-linux.yml
          # The release job downloads these in the same run; keeping them 90 days blows the storage quota.
          retention-days: 1

  release:
    needs: [check, build-windows, build-mac, build-linux]
    if: needs.check.outputs.skip == 'false' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      # One checksum file over every asset, so a download can be checked without the gh CLI.
      - name: Write SHA256SUMS
        working-directory: artifacts
        run: sha256sum * > SHA256SUMS && cat SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: v${{ needs.check.outputs.version }}
          name: v${{ needs.check.outputs.version }}
          files: artifacts/**
          # A release with a missing installer is worse than no release: the updater would offer it.
          fail_on_unmatched_files: true
          generate_release_notes: true
