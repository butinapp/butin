name: Publish npm

# Publish the library graph (@butinapp/sdk → shapes → ui) to npm whenever the lockstep version — anchored on
# packages/sdk/package.json — changes on master. The three move together: bump them with `pnpm bump-libs
# <version|patch|minor|major>` (never hand-edit one — leaving sdk behind makes the check below skip and nothing
# publishes), commit, push. Only these three packages are non-private, so `pnpm -r publish` targets exactly them,
# in dependency order. The check job no-ops if the version is already on npm. A manual run is a dry run.
on:
  push:
    branches:
      - master
    paths:
      - packages/sdk/package.json
      - packages/shapes/package.json
      - packages/ui/package.json
  workflow_dispatch:

concurrency:
  group: publish-npm-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      skip: ${{ steps.ver.outputs.skip }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: ver
        run: |
          VERSION=$(node -p "require('./packages/sdk/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "@butinapp/sdk@$VERSION" version >/dev/null 2>&1; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

  publish:
    needs: check
    # A manual run always proceeds as a dry run; a push publishes only when the version is new.
    if: github.event_name == 'workflow_dispatch' || needs.check.outputs.skip == 'false'
    runs-on: ubuntu-latest
    # OIDC trusted publishing: no stored token. pnpm mints a short-lived credential per run from the GitHub
    # id-token, so there's nothing to leak or phish. Requires (one-time, per package on npmjs.com → package
    # Settings → Trusted Publisher): GitHub Actions publisher = butinapp/butin, workflow = publish-npm.yml,
    # environment = npm-publish. Provenance is generated automatically (needs this public repo). The
    # environment still gates each publish behind its required-reviewer rule.
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC → npm trusted publishing + provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @butinapp/sdk --filter @butinapp/shapes --filter @butinapp/ui build
      # The three packages are named rather than "everything not private", so a package that loses its private
      # flag by mistake does not publish. --provenance makes the attestation a requirement of the publish, not a
      # side effect of trusted publishing.
      - name: Publish (dry run on manual dispatch)
        env:
          EVENT: ${{ github.event_name }}
        run: |
          DRY=""
          if [ "$EVENT" != "push" ]; then DRY="--dry-run"; fi
          pnpm --filter @butinapp/sdk --filter @butinapp/shapes --filter @butinapp/ui publish --access public --no-git-checks --provenance $DRY
      # A publish that reached the registry without an attestation is a publish to roll back, not to trust.
      - name: Verify the provenance attestation
        if: github.event_name == 'push'
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          for pkg in sdk shapes ui; do
            url=$(npm view "@butinapp/$pkg@$VERSION" dist.attestations.url 2>/dev/null || true)
            if [ -z "$url" ]; then
              echo "::error::@butinapp/$pkg@$VERSION has no provenance attestation on the registry"
              exit 1
            fi
            echo "@butinapp/$pkg@$VERSION: $url"
          done
